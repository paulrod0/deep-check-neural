[package]
name = "bpas-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Proprietary"
description = "BPAS endpoint agent for continuous behavioural authentication"
authors = ["Deep-Check"]

[features]
# Default = no TPM dependency; the agent prints a clear error if asked to use
# a real TPM. Enable the `tpm` feature in production builds:
#
#     cargo build --release --features tpm
#
default = []
tpm = ["tss-esapi"]

[[bin]]
name = "bpas-agent"
path = "src/main.rs"

[dependencies]
tss-esapi = { version = "7.5", optional = true }
# Async runtime
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "io-util", "net"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.12"
prost-types = "0.12"

# Crypto
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.5"

# TLS / networking
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

# Tracing / observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
config = { version = "0.14", default-features = false, features = ["toml"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Channels & ring buffer
crossbeam-channel = "0.5"
parking_lot = "0.12"

# UUID
uuid = { version = "1.8", features = ["v4", "serde"] }

# For keyboard/mouse capture (platform-specific)
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
nix = { version = "0.28", features = ["fs", "mman"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.56", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release-with-debug]
inherits = "release"
strip = "none"
debug = true

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
