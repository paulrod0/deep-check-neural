<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <!-- Escudo / shield isotipo -->
  <g transform="translate(20, 30)">
    <!-- Marco escudo -->
    <path d="M 50 5 L 95 25 L 95 70 Q 95 90 50 110 Q 5 90 5 70 L 5 25 Z"
          fill="#0a2540" stroke="#00d2ff" stroke-width="3"/>
    <!-- Check interior -->
    <path d="M 30 60 L 45 75 L 75 40"
          fill="none" stroke="#00d2ff" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Punto digital -->
    <circle cx="80" cy="35" r="4" fill="#00d2ff"/>
    <circle cx="20" cy="50" r="3" fill="#00d2ff" opacity="0.6"/>
    <circle cx="35" cy="25" r="2.5" fill="#00d2ff" opacity="0.4"/>
  </g>

  <!-- Texto -->
  <g transform="translate(140, 0)">
    <text x="0" y="80" font-family="Helvetica, Arial, sans-serif"
          font-weight="700" font-size="48" fill="#0a2540"
          letter-spacing="-1.5">Deep-Check</text>
    <text x="0" y="110" font-family="Helvetica, Arial, sans-serif"
          font-weight="400" font-size="15" fill="#4a5568"
          letter-spacing="2">VERIFICACIÓN FORENSE DIGITAL</text>
  </g>
</svg>