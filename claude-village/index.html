<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Pueblo de Pablo · Agentes de Claude</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏘️</text></svg>">
<style>
  :root{
    --texto:#1e2a3a;
    --chip-fondo:rgba(255,255,255,.78);
    --suelo1:#7ec850; --suelo2:#5aa83e; --camino:#d9b98c;
    --montana1:#9fc4e8; --montana2:#7aa8d4;
    --casa-pared:#f3e3c9; --casa-tejado:#c4554d; --ventana:#9ad2e8;
    --bocadillo-fondo:#ffffff; --bocadillo-texto:#22303f;
  }
  body.noche{
    --texto:#e8eefb;
    --chip-fondo:rgba(20,30,55,.72);
    --suelo1:#2e4a33; --suelo2:#1f3525; --camino:#6b5b41;
    --montana1:#2b3a5e; --montana2:#1f2c49;
    --casa-pared:#b7a98c; --casa-tejado:#7e3a35; --ventana:#ffd66e;
    --bocadillo-fondo:#1f2b44; --bocadillo-texto:#eaf0ff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color:var(--texto);
    user-select:none;
  }

  /* ---------- CIELO ---------- */
  #cielo-dia,#cielo-noche{position:fixed; inset:0; transition:opacity 1.4s ease;}
  #cielo-dia{background:linear-gradient(#7fc4f4 0%, #aedcf8 45%, #ffe9c4 78%, #ffd9a8 100%); opacity:1;}
  #cielo-noche{background:linear-gradient(#0a1230 0%, #16234d 50%, #2b3a6b 85%, #3b4a7d 100%); opacity:0;}
  body.noche #cielo-dia{opacity:0;}
  body.noche #cielo-noche{opacity:1;}

  #estrellas{position:fixed; inset:0; opacity:0; transition:opacity 1.4s ease; pointer-events:none;}
  body.noche #estrellas{opacity:1;}
  .estrella{position:absolute; background:#fff; border-radius:50%; animation:titila 3s ease-in-out infinite;}
  @keyframes titila{0%,100%{opacity:.25;} 50%{opacity:1;}}

  #astro{
    position:fixed; width:74px; height:74px; border-radius:50%;
    top:9%; right:12%;
    background:radial-gradient(circle at 35% 35%, #fff7d6, #ffd84d 60%, #ffb52e);
    box-shadow:0 0 60px 22px rgba(255,214,80,.55);
    transition:all 1.4s ease;
  }
  body.noche #astro{
    background:radial-gradient(circle at 38% 35%, #ffffff, #e8ecf4 55%, #c6cede);
    box-shadow:0 0 44px 14px rgba(220,230,255,.35);
    right:72%;
  }

  .nube{position:fixed; pointer-events:none; opacity:.92; transition:opacity 1.4s ease; animation:flota linear infinite;}
  body.noche .nube{opacity:.18;}
  .nube div{position:absolute; background:#fff; border-radius:50px;}
  @keyframes flota{from{transform:translateX(-260px);} to{transform:translateX(calc(100vw + 260px));}}

  /* ---------- PAISAJE ---------- */
  #montanas{position:fixed; left:0; right:0; bottom:128px; height:34vh; pointer-events:none;}
  #montanas svg{width:100%; height:100%;}
  .mont1{fill:var(--montana1); transition:fill 1.4s ease;}
  .mont2{fill:var(--montana2); transition:fill 1.4s ease;}

  #suelo{
    position:fixed; left:0; right:0; bottom:0; height:148px;
    background:linear-gradient(var(--suelo1), var(--suelo2));
    transition:background 1.4s ease;
  }
  #camino{
    position:fixed; left:0; right:0; bottom:26px; height:58px;
    background:var(--camino); opacity:.55;
    border-radius:50% 50% 0 0 / 14px;
    transition:background 1.4s ease;
  }

  /* ---------- CASAS ---------- */
  .casa{position:fixed; bottom:128px; pointer-events:none;}
  .casa svg{display:block;}
  .pared{fill:var(--casa-pared); transition:fill 1.4s ease;}
  .tejado{fill:var(--casa-tejado); transition:fill 1.4s ease;}
  .ventana{fill:var(--ventana); transition:fill 1.4s ease;}
  body.noche .ventana{filter:drop-shadow(0 0 6px rgba(255,214,110,.9));}
  .letrero-casa{
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:-22px; white-space:nowrap;
    font-size:11px; font-weight:600; letter-spacing:.4px;
    background:var(--chip-fondo); color:var(--texto);
    padding:2px 9px; border-radius:10px;
    backdrop-filter:blur(4px);
    transition:background 1.4s ease, color 1.4s ease;
  }

  /* ---------- INTERFAZ ---------- */
  header{
    position:fixed; top:14px; left:16px; right:16px; z-index:5000;
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    pointer-events:none;
  }
  #titulo h1{font-size:clamp(18px,3vw,28px); text-shadow:0 1px 0 rgba(255,255,255,.25);}
  body.noche #titulo h1{text-shadow:0 1px 8px rgba(0,0,0,.5);}
  #titulo p{font-size:12.5px; opacity:.85; margin-top:2px;}
  #chips{display:flex; gap:8px; margin-top:9px; flex-wrap:wrap;}
  .chip{
    background:var(--chip-fondo); padding:4px 11px; border-radius:14px;
    font-size:12px; font-weight:600; backdrop-filter:blur(6px);
    box-shadow:0 1px 4px rgba(0,0,0,.12);
    transition:background 1.4s ease;
  }
  #btn-ciclo{
    pointer-events:auto; cursor:pointer; border:none;
    width:46px; height:46px; border-radius:50%;
    font-size:22px; background:var(--chip-fondo);
    box-shadow:0 2px 8px rgba(0,0,0,.18);
    backdrop-filter:blur(6px);
    transition:transform .2s ease, background 1.4s ease;
  }
  #btn-ciclo:hover{transform:scale(1.12) rotate(12deg);}

  #pista{
    position:fixed; bottom:8px; left:50%; transform:translateX(-50%);
    font-size:11.5px; background:var(--chip-fondo); color:var(--texto);
    padding:4px 13px; border-radius:12px; z-index:5000;
    backdrop-filter:blur(6px); opacity:.92;
    transition:background 1.4s ease, color 1.4s ease;
    white-space:nowrap;
  }

  /* ---------- PERSONITAS ---------- */
  #personitas{position:fixed; inset:0; z-index:100;}
  .personita{
    position:absolute; bottom:0; left:0;
    cursor:pointer; pointer-events:auto;
    will-change:transform;
  }
  .personita .cuerpo-svg{display:block; transition:transform .25s ease;}
  .personita.mirando-izq .cuerpo-svg{transform:scaleX(-1);}
  .personita .interior{animation:bob .56s ease-in-out infinite; animation-play-state:paused;}
  .personita.andando .interior{animation-play-state:running;}
  @keyframes bob{0%,100%{transform:translateY(0);} 50%{transform:translateY(-2.6px);}}

  .pierna{transform-box:fill-box; transform-origin:top center; animation:paso .4s ease-in-out infinite alternate; animation-play-state:paused;}
  .personita.andando .pierna{animation-play-state:running;}
  .pierna-d{animation-delay:-.4s;}
  @keyframes paso{from{transform:rotate(-24deg);} to{transform:rotate(24deg);}}

  .ojo{transform-box:fill-box; transform-origin:center; animation:parpadeo 4.4s infinite;}
  @keyframes parpadeo{0%,91%,100%{transform:scaleY(1);} 94%{transform:scaleY(.08);}}
  .ojo-cerrado{display:none;}
  .durmiendo .ojo{display:none;}
  .durmiendo .ojo-cerrado{display:block;}
  .durmiendo .interior{animation:sueno 3.4s ease-in-out infinite; animation-play-state:running;}
  @keyframes sueno{0%,100%{transform:rotate(0deg) translateY(0);} 50%{transform:rotate(3deg) translateY(1.6px);}}

  .sombra{
    position:absolute; left:50%; bottom:-4px; transform:translateX(-50%);
    background:rgba(0,0,0,.22); border-radius:50%;
    filter:blur(2px);
  }
  .etiqueta{
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:-24px; white-space:nowrap;
    font-size:10.5px; font-weight:700; letter-spacing:.3px;
    background:var(--chip-fondo); color:var(--texto);
    padding:2px 8px; border-radius:9px;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
    transition:background 1.4s ease, color 1.4s ease;
    pointer-events:none;
  }
  .bocadillo{
    position:absolute; left:50%; bottom:calc(100% + 12px);
    transform:translateX(-50%) translateY(6px) scale(.85);
    background:var(--bocadillo-fondo); color:var(--bocadillo-texto);
    font-size:12px; font-weight:600; line-height:1.35;
    padding:7px 11px; border-radius:12px;
    max-width:190px; width:max-content; text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.18);
    opacity:0; transition:opacity .25s ease, transform .25s ease, background 1.4s ease;
    pointer-events:none; z-index:50;
  }
  .bocadillo::after{
    content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:7px solid transparent; border-top-color:var(--bocadillo-fondo);
    transition:border-top-color 1.4s ease;
  }
  .bocadillo.visible{opacity:1; transform:translateX(-50%) translateY(0) scale(1);}

  .personita.salta .interior{animation:brinco .45s ease;}
  @keyframes brinco{0%,100%{transform:translateY(0);} 40%{transform:translateY(-14px);}}

  /* ---------- MODO EN DIRECTO (trabajando) ---------- */
  .portatil{
    position:absolute; left:50%; bottom:-3px; transform:translateX(-50%);
    font-size:21px; display:none; z-index:6;
    filter:drop-shadow(0 0 6px rgba(120,220,160,.8));
  }
  .personita.trabajando .portatil{display:block; animation:portatil-late 1.1s ease-in-out infinite;}
  @keyframes portatil-late{0%,100%{transform:translateX(-50%) scale(1);} 50%{transform:translateX(-50%) scale(1.1);}}
  .personita.trabajando .interior{animation:tecleo .16s linear infinite;}
  @keyframes tecleo{
    0%,100%{transform:translateY(0) rotate(0deg);}
    25%{transform:translateY(-.9px) rotate(-.7deg);}
    75%{transform:translateY(.5px) rotate(.7deg);}
  }
  .personita.trabajando .etiqueta::before{
    content:"● "; color:#21d07a; animation:pulso-directo 1s ease-in-out infinite;
  }
  @keyframes pulso-directo{0%,100%{opacity:1;} 50%{opacity:.25;}}
  #chip-directo.vivo{color:#0e7a43;}
  body.noche #chip-directo.vivo{color:#5ef0a5;}

  /* ---------- COHETE ---------- */
  #cohete{
    position:fixed; font-size:30px; z-index:4000; pointer-events:none;
    opacity:0;
  }
  #cohete.volando{animation:despegue 2.6s ease-in forwards;}
  @keyframes despegue{
    0%{opacity:0; transform:translateY(0) rotate(-4deg);}
    12%{opacity:1;}
    100%{opacity:0; transform:translateY(-78vh) rotate(6deg);}
  }

  /* ---------- TARJETA ---------- */
  #tarjeta{
    position:fixed; right:18px; bottom:18px; z-index:6000;
    width:320px; max-width:calc(100vw - 36px);
    background:var(--chip-fondo); color:var(--texto);
    border-radius:18px; padding:18px;
    box-shadow:0 10px 36px rgba(0,0,0,.30);
    backdrop-filter:blur(14px);
    transform:translateY(20px); opacity:0; pointer-events:none;
    transition:opacity .28s ease, transform .28s ease, background 1.4s ease, color 1.4s ease;
  }
  #tarjeta.visible{opacity:1; transform:translateY(0); pointer-events:auto;}
  #tarjeta .cerrar{
    position:absolute; top:10px; right:12px; border:none; background:none;
    font-size:18px; cursor:pointer; color:inherit; opacity:.6;
  }
  #tarjeta .cerrar:hover{opacity:1;}
  #t-cabecera{display:flex; align-items:center; gap:13px; margin-bottom:11px;}
  #t-avatar{width:58px; height:80px; flex-shrink:0;}
  #t-avatar svg{width:100%; height:100%;}
  #t-nombre{font-size:17px; font-weight:800;}
  #t-oficio{font-size:12.5px; opacity:.8; margin-top:1px;}
  .t-fila{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:4.5px 0; border-top:1px solid rgba(128,128,128,.18);}
  .t-fila b{font-weight:700; flex-shrink:0;}
  .t-fila span{text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .t-fila .ruta{font-family:ui-monospace, Menlo, monospace; font-size:10.5px; opacity:.8;}
  .punto-estado{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:1px;}
  #t-bio{font-size:12.5px; line-height:1.5; margin-top:9px; opacity:.92;}
  #t-frase{font-size:12px; font-style:italic; margin-top:9px; opacity:.75;}

  @media (max-width:640px){
    #titulo p{display:none;}
    .chip{font-size:10.5px; padding:3px 8px;}
    #pista{font-size:10px;}
    #tarjeta{right:10px; left:10px; bottom:10px; width:auto;}
  }
</style>
</head>

// ============================================================
//  Utilidades de estado
// ============================================================
function diasDesde(fecha){
  if(!fecha) return null;
  return Math.floor((Date.now() - new Date(fecha + 'T12:00:00')) / 864e5);
}
function estadoDe(p){
  if(p.tipo === 'mascota') return {clave:'activo', etiqueta:'Siempre de guardia', color:'#27c46d'};
  const d = diasDesde(p.ultima);
  if(d === null)  return {clave:'banquillo', etiqueta:'Sin estrenar', color:'#a06bd4'};
  if(d <= 1)      return {clave:'activo', etiqueta:'Activo hoy', color:'#27c46d'};
  if(d <= 7)      return {clave:'semana', etiqueta:'Activo esta semana', color:'#8fc42a'};
  if(d <= 10)     return {clave:'descanso', etiqueta:'Descansando', color:'#e0a32e'};
  return {clave:'siesta', etiqueta:'Echando la siesta', color:'#7a8aa8'};
}
function ultimaTexto(p){
  if(!p.ultima) return 'todavía nunca';
  const d = diasDesde(p.ultima);
  let rel;
  if(d <= 0) rel = 'hoy';
  else if(d === 1) rel = 'ayer';
  else if(d < 14) rel = 'hace ' + d + ' días';
  else rel = 'hace ' + Math.round(d/7) + ' semanas';
  return rel + ' · ' + p.ultima;
}

      <circle cx="67" cy="40" r="4" fill="${p.piel}"/>
      <text x="70" y="36" text-anchor="middle" font-size="15">${p.emoji}</text>
      <circle cx="40" cy="17" r="15.5" fill="${p.piel}"/>
      <path d="M24.5,17 a15.5,15.5 0 0 1 31,0 l-3,0 a12.5,13 0 0 0 -25,0 z" fill="${p.pelo}"/>
      <circle class="ojo" cx="34" cy="18" r="2.1" fill="#222"/>
      <circle class="ojo" cx="46" cy="18" r="2.1" fill="#222"/>
      <path class="ojo-cerrado" d="M31.5,18.5 q2.5,2.4 5,0" stroke="#222" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <path class="ojo-cerrado" d="M43.5,18.5 q2.5,2.4 5,0" stroke="#222" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <circle cx="30.5" cy="23" r="2.4" fill="#f29a9a" opacity=".55"/>
      <circle cx="49.5" cy="23" r="2.4" fill="#f29a9a" opacity=".55"/>

  const doc = new DOMParser().parseFromString(svgTexto, 'image/svg+xml');

}

// ============================================================
//  Clase Personita
// ============================================================
const contenedor = document.getElementById('personitas');

class Personita {
  constructor(d, hueco, total){
    this.d = d;
    this.estado = estadoDe(d);
    this.duerme = this.estado.clave === 'siesta';
    this.ancho = d.tipo === 'agente' ? 50 : (d.tipo === 'mascota' ? 84 : 76);

    this.profundidad = 8 + Math.random()*42;            // px sobre el borde inferior
    this.escala = 1 - (this.profundidad - 8) * 0.005;   // los de atrás, un pelín más pequeños
    // repartidos a lo largo del pueblo desde el principio, con algo de azar
    const franja = Math.max(320, window.innerWidth - 160);
    this.x = 80 + ((hueco + 0.5) / total) * franja + (Math.random()*56 - 28);
    this.dir = Math.random() < .5 ? -1 : 1;
    this.vel = d.tipo === 'agente' ? 46 + Math.random()*34 : 15 + Math.random()*20;

    this.modo = 'parada';
    this.hasta = performance.now() + 600 + Math.random()*2600;
    this.objetivo = this.x;
    this.proxFrase = performance.now() + 2500 + Math.random()*9000;
    this.trabajando = false;
    this.accionTexto = '';

    // DOM (sin innerHTML: createElement + textContent)
    this.el = document.createElement('div');
    this.el.className = 'personita';
    this.el.style.zIndex = String(Math.round(1000 - this.profundidad));

    this.boc = document.createElement('div');
    this.boc.className = 'bocadillo';

    const sprite = creaSpriteEl(d, this.ancho);

    const sombra = document.createElement('div');
    sombra.className = 'sombra';
    sombra.style.width = (this.ancho*0.7) + 'px';
    sombra.style.height = (this.ancho*0.16) + 'px';

    const etiqueta = document.createElement('div');
    etiqueta.className = 'etiqueta';
    etiqueta.textContent = d.nombre;

    this.portatil = document.createElement('div');
    this.portatil.className = 'portatil';
    this.portatil.textContent = '💻';

    this.el.append(this.boc, sprite, sombra, etiqueta, this.portatil);

    this.el.querySelectorAll('.ojo').forEach(o => {
      o.style.animationDelay = (-Math.random()*4.4).toFixed(2) + 's';
    });

    if(this.duerme) this.el.classList.add('durmiendo');
    this.el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      this.el.classList.remove('salta');
      void this.el.offsetWidth;
      this.el.classList.add('salta');
      abreTarjeta(this);
    });
    contenedor.appendChild(this.el);
    this.aplica();
  }

  aplica(){
    this.el.style.transform =
      'translate3d(' + (this.x - this.ancho/2) + 'px, 0, 0) scale(' + this.escala + ')';
    this.el.style.bottom = (28 + this.profundidad) + 'px';
    this.el.classList.toggle('mirando-izq', this.dir < 0);
  }

  habla(texto, dur){
    this.boc.textContent = texto;
    this.boc.classList.add('visible');
    clearTimeout(this._tBoc);
    this._tBoc = setTimeout(() => this.boc.classList.remove('visible'), dur || 3800);
  }

  hablaFija(texto){
    clearTimeout(this._tBoc);
    this.boc.textContent = texto;
    this.boc.classList.add('visible');
  }

  empiezaTrabajo(texto){
    if(this.duerme){
      this.duerme = false;
      this.el.classList.remove('durmiendo');
      this.habla('¡Me llaman! 😳', 2000);
    }
    if(!this.trabajando){
      this.trabajando = true;
      this.el.classList.add('trabajando');
      this.el.classList.remove('andando');
      this.modo = 'parada';
    }
    if(texto !== this.accionTexto){
      this.accionTexto = texto;
      this.hablaFija(texto);
    }
  }

  terminaTrabajo(){
    if(!this.trabajando) return;
    this.trabajando = false;
    this.accionTexto = '';
    this.el.classList.remove('trabajando');
    this.habla('¡Listo! ✅', 3200);
    this.hasta = performance.now() + 1500 + Math.random()*2000;
    if(estadoDe(this.d).clave === 'siesta'){
      this.duerme = true;
      this.el.classList.add('durmiendo');
    }
  }

  tick(ahora, dt){
    if(!this.duerme && !this.trabajando){
      // Claude acude junto a la personita que esté trabajando
      let destinoFijo = null;
      if(this.d.tipo === 'mascota' && seguirA && seguirA.trabajando){
        destinoFijo = Math.max(60, Math.min(seguirA.x + 84, window.innerWidth - 60));
      }
      if(destinoFijo !== null){
        if(Math.abs(destinoFijo - this.x) > 30){
          this.objetivo = destinoFijo;
          this.dir = destinoFijo > this.x ? 1 : -1;
          if(this.modo !== 'pasea'){ this.modo = 'pasea'; this.el.classList.add('andando'); }
        } else if(this.modo === 'pasea'){
          this.modo = 'parada';
          this.el.classList.remove('andando');
          this.hasta = ahora + 4000;
        }
      }
      if(this.modo === 'pasea'){
        this.x += this.vel * dt * this.dir;
        if((this.dir > 0 && this.x >= this.objetivo) || (this.dir < 0 && this.x <= this.objetivo)){
          this.x = this.objetivo;
          this.modo = 'parada';
          this.hasta = ahora + 900 + Math.random()*3800;
          this.el.classList.remove('andando');
        }
      } else if(destinoFijo === null && ahora > this.hasta){
        const margen = 50;
        this.objetivo = margen + Math.random() * Math.max(120, window.innerWidth - margen*2);
        this.dir = this.objetivo > this.x ? 1 : -1;
        this.modo = 'pasea';
        this.el.classList.add('andando');
      }
    }
    if(!this.trabajando && ahora > this.proxFrase){
      if(this.duerme){
        this.habla(Math.random() < .7 ? '💤' : 'zZz…', 2600);
        this.proxFrase = ahora + 6000 + Math.random()*8000;
      } else {
        const f = this.d.frases[Math.floor(Math.random()*this.d.frases.length)];
        this.habla(f);
        this.proxFrase = ahora + 9000 + Math.random()*14000;
      }
    }
    this.aplica();
  }
}

// Huecos barajados (Fisher-Yates) para que proyectos y agentes queden mezclados
const huecos = [...PERSONAJES.keys()];
for(let i = huecos.length - 1; i > 0; i--){
  const j = Math.floor(Math.random() * (i + 1));
  [huecos[i], huecos[j]] = [huecos[j], huecos[i]];
}
const habitantes = PERSONAJES.map((d, i) => new Personita(d, huecos[i], PERSONAJES.length));

// Chips de estadísticas
const nProy = PERSONAJES.filter(p => p.tipo === 'proyecto').length;
const nAgen = PERSONAJES.filter(p => p.tipo === 'agente').length;
const nSes = PERSONAJES.reduce((s,p) => s + (p.sesiones || 0), 0);
document.getElementById('chip-proyectos').textContent = '📁 ' + nProy + ' proyectos';
document.getElementById('chip-agentes').textContent = '🤖 ' + nAgen + ' agentes + Claude';
document.getElementById('chip-sesiones').textContent = '💬 ' + nSes + ' sesiones';

// Bucle de animación
let antes = performance.now();
function bucle(ahora){
  const dt = Math.min(0.05, (ahora - antes) / 1000);
  antes = ahora;
  for(const h of habitantes) h.tick(ahora, dt);
  requestAnimationFrame(bucle);
}
requestAnimationFrame(bucle);

    '-Users-hium--gemini-antigravity-scratch-deep-check',
    '-Users-hium-.gemini-antigravity-scratch-deep-check'
  ],
  'exhaust': [
    '-Users-hium-Documents-ExhaustMarket',
    '-Users-hium-Documents-Documentos---Pablo-s-MacBook-Pro-ExhaustMarket',
    '-Users-hium-Documents-Documentos - Pablo’s MacBook Pro-ExhaustMarket'
  ],
  'krayin': ['-Users-hium-TESTKrayin'],
  'hium': ['-Users-hium-Documents-HIUM'],
  'casas': ['-Users-hium-CASAS'],
  'momento': ['-Users-hium-IN-momento', '-Users-hium-IN-momento-apps-web', '-Users-hium-IN'],
  'birthday': ['-Users-hium-birthday-room'],
  'rubin': ['-Users-hium--gemini-antigravity-scratch-deep-check--claude-worktrees-practical-rubin-a0f2fc'],
  'allen': ['-Users-hium--gemini-antigravity-scratch-deep-check--claude-worktrees-modest-allen-bb2e96'],
  'elbakyan': ['-Users-hium--gemini-antigravity-scratch-deep-check--claude-worktrees-reverent-elbakyan-94b0b3'],
  'haibt': ['-Users-hium-Documents-ExhaustMarket--claude-worktrees-keen-haibt-20810a'],

  'dhawan': ['-Users-hium--gemini-antigravity-scratch-deep-check--claude-worktrees-friendly-dhawan-951cd8'],
  'bardeen': ['-Users-hium--gemini-antigravity-scratch-deep-check--claude-worktrees-sleepy-bardeen-8545dc']
};
const IGNORADAS = new Set(['-Users-hium']);
const carpetasConocidas = new Set([...IGNORADAS, ...Object.values(CLAVES).flat()]);

const EMOJI_HERRAMIENTA = {
  Bash:'🖥️', Edit:'✏️', Write:'📝', Read:'📖', Grep:'🔎', Glob:'🗂️',
  WebFetch:'🌐', WebSearch:'🌐', Agent:'🤖', Task:'🗒️', TodoWrite:'🗒️',
  NotebookEdit:'📓', Skill:'🪄', Workflow:'🕸️'
};
function textoAccion(r){
  if(!r) return '🛠️ trabajando…';
  if(r.accion === 'herramienta'){
    let h = r.herramienta || 'herramienta';
    const e = EMOJI_HERRAMIENTA[h] || (h.startsWith('mcp__') ? '🔌' : '🛠️');
    if(h.startsWith('mcp__')) h = h.split('__').pop();
    const det = r.detalle ? ' ' + r.detalle : '';
    let texto = e + ' ' + h + det;
    if(texto.length > 52) texto = texto.slice(0, 52) + '…';
    return texto;
  }
  const mapa = {
    escribiendo:'💬 escribiendo respuesta…',
    pensando:'🧠 pensando…',
    resultados:'👀 revisando resultados…',
    ordenes:'📨 leyendo a Pablo…',
    trabajando:'🛠️ trabajando…'
  };
  return mapa[r.accion] || '🛠️ trabajando…';
}

// Personitas para proyectos/agentes que aparezcan con el pueblo ya abierto
const PALETA_NUEVOS = ['#4a7dbd','#bd4a8e','#4abd86','#bd8a4a','#7d4abd'];
function nombreDeCarpeta(c){
  const m = c.match(/-claude-worktrees-(.+?)(-[0-9a-f]{4,8})?$/);
  if(m) return m[1];
  return c.replace(/^-Users-hium-?/, '').replace(/^Documents-/, '')
          .split('-').filter(Boolean).slice(-2).join(' ') || 'misterioso';
}
function spawnDesconocido(info){
  const esAgente = info.carpeta.includes('-claude-worktrees-');
  const d = {
    id: 'nuevo-' + info.carpeta,
    nombre: nombreDeCarpeta(info.carpeta),
    oficio: esAgente ? 'Agente recién llegado' : 'Proyecto recién llegado',
    tipo: esAgente ? 'agente' : 'proyecto',
    camiseta: esAgente ? '#e58e6a' : PALETA_NUEVOS[habitantes.length % PALETA_NUEVOS.length],
    pelo:'#2b2b2b', piel:'#e8b48c', emoji:'✨',
    sesiones: info.sesiones,
    ultima: info.ultimaMod ? new Date(info.ultimaMod*1000).toISOString().slice(0,10) : null,
    ruta: info.carpeta,
    bio: 'Apareció en el pueblo mientras mirabas. Nadie sabe aún su historia, pero ya tiene carpeta en ~/.claude/projects.',
    frases:['Acabo de llegar al pueblo 👋','¿Dónde firmo? 📝','Soy nuevo por aquí…']
  };
  PERSONAJES.push(d);
  CLAVES[d.id] = [info.carpeta];
  carpetasConocidas.add(info.carpeta);
  const p = new Personita(d, Math.floor(Math.random()*PERSONAJES.length), PERSONAJES.length);
  habitantes.push(p);
  p.habla('¡Hola! Acabo de llegar 👋', 4500);
}

function aplicaEstadoVivo(datos){
  const porCarpeta = new Map(datos.proyectos.map(p => [p.carpeta, p]));
  let trabajandoAhora = 0;
  let totalSesiones = 0;
  for(const p of datos.proyectos) totalSesiones += p.sesiones;

  let masReciente = null;
  for(const h of habitantes){
    if(h.d.tipo === 'mascota') continue;
    const mios = (CLAVES[h.d.id] || []).map(c => porCarpeta.get(c)).filter(Boolean);
    if(!mios.length) continue;

    const ses = mios.reduce((s,m) => s + m.sesiones, 0);
    const ult = Math.max(...mios.map(m => m.ultimaMod || 0));
    if(ses > 0) h.d.sesiones = ses;
    if(ult > 0) h.d.ultima = new Date(ult*1000).toISOString().slice(0,10);
    h.estado = estadoDe(h.d);

    const activo = mios.find(m => m.activo);
    if(activo){
      trabajandoAhora++;
      h.empiezaTrabajo(textoAccion(activo.resumen));
      if(!masReciente || activo.ultimaMod > masReciente.ult){
        masReciente = {h, ult: activo.ultimaMod};
      }
    } else {
      h.terminaTrabajo();
    }
  }

  // proyectos/agentes nuevos que no estaban en el censo
  for(const p of datos.proyectos){
    if(p.sesiones > 0 && !carpetasConocidas.has(p.carpeta)) spawnDesconocido(p);
  }

  // Claude va a echar una mano al más activo
  const claudeP = habitantes.find(h => h.d.tipo === 'mascota');
  if(masReciente && seguirA !== masReciente.h){
    seguirA = masReciente.h;
    if(claudeP) claudeP.habla('Voy a ayudar a ' + seguirA.d.nombre + ' ✳', 4000);
  } else if(!masReciente){
    seguirA = null;
  }

  // chips
  document.getElementById('chip-sesiones').textContent = '💬 ' + totalSesiones + ' sesiones';
  const chipD = document.getElementById('chip-directo');
  chipD.classList.add('vivo');
  chipD.textContent = trabajandoAhora > 0
    ? '🟢 EN DIRECTO · ' + trabajandoAhora + ' trabajando'
    : '🟢 EN DIRECTO · todo tranquilo';

  // refrescar la ficha si está abierta
  if(tarjetaAbierta && tarjeta.classList.contains('visible')){
    const filaAhora = document.getElementById('t-fila-ahora');
    if(tarjetaAbierta.trabajando && tarjetaAbierta.accionTexto){
      document.getElementById('t-ahora').textContent = tarjetaAbierta.accionTexto;
      filaAhora.style.display = '';
    } else {
      filaAhora.style.display = 'none';
    }
    document.getElementById('t-sesiones').textContent =
      tarjetaAbierta.d.sesiones === null ? '∞ (es Claude)' : tarjetaAbierta.d.sesiones + ' con Claude';
    document.getElementById('t-ultima').textContent = ultimaTexto(tarjetaAbierta.d);
  }
}

async function sondea(){
  try {
    const r = await fetch('api/estado', {cache:'no-store'});
    if(!r.ok) throw new Error('http ' + r.status);
    aplicaEstadoVivo(await r.json());
  } catch(err){
    const chipD = document.getElementById('chip-directo');
    chipD.classList.remove('vivo');
    chipD.textContent = '📷 foto fija — abre con servidor.py para el directo';
    for(const h of habitantes) h.terminaTrabajo();
    seguirA = null;
  }
}
sondea();
setInterval(sondea, 3000);
</script>
