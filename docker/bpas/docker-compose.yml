# Local end-to-end deployment of the BPAS stack.
#
# Run from the repo root:
#
#   ./mtls/gen_certs.sh   # once, to generate certificates
#   docker compose -f docker/bpas/docker-compose.yml up --build
#
# The agent container mounts /dev/input (read-only) to capture keyboard and
# mouse events on Linux hosts. On macOS or Windows hosts the capture modules
# degrade to stubs and only the transport layer is exercised end-to-end.

name: bpas

services:
  worker:
    build:
      context: ../..
      dockerfile: docker/bpas/Dockerfile.worker
    image: bpas-worker:latest
    container_name: bpas-worker
    read_only: true
    restart: unless-stopped
    ports:
      - "8443:8443"
      - "8090:8090"   # Prometheus /metrics (same port as /v1/*, plain HTTP not exposed)
    environment:
      BPAS_HOST: 0.0.0.0
      BPAS_PORT: 8443
      BPAS_DEVICE: cpu
      BPAS_DEFAULT_ROLE: general
      BPAS_LOG_LEVEL: info
      BPAS_ADMIN_TOKEN: ${BPAS_ADMIN_TOKEN:-dev-admin-token-change-me}
      BPAS_HMAC_KEY_PATH: /etc/bpas/hmac.key
    command:
      - "--host=0.0.0.0"
      - "--port=8443"
      - "--server-cert=/etc/bpas/server.crt"
      - "--server-key=/etc/bpas/server.key"
      - "--client-ca=/etc/bpas/ca.crt"
    volumes:
      - type: bind
        source: ../../mtls/out
        target: /etc/bpas
        read_only: true
      - type: bind
        source: ../../models
        target: /models
        read_only: true
      - type: tmpfs
        target: /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fksS --cacert /etc/bpas/ca.crt https://127.0.0.1:8443/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  agent:
    build:
      context: ../../agent-rust
      dockerfile: Dockerfile
    image: bpas-agent:latest
    container_name: bpas-agent
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped
    environment:
      BPAS_CONFIG: /etc/bpas/agent.toml
      RUST_LOG: info
    volumes:
      - type: bind
        source: ../../mtls/out
        target: /etc/bpas/mtls
        read_only: true
      - type: bind
        source: ./agent.toml
        target: /etc/bpas/agent.toml
        read_only: true
      - type: bind
        source: /dev/input
        target: /dev/input
        read_only: true
    cap_drop: [ALL]
    cap_add: [IPC_LOCK]
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/input:/dev/input:r

volumes: {}
