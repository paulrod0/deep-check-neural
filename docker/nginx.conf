# Deep-Check — Nginx reverse proxy config
# Place TLS certificates at docker/certs/deepcheck.crt and docker/certs/deepcheck.key

# Rate limiting (per client IP) for the public surface
limit_req_zone $binary_remote_addr zone=dc_api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/deepcheck.crt;
    ssl_certificate_key /etc/nginx/certs/deepcheck.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size (for document forensics)
    client_max_body_size 25M;

    # Next.js app
    location / {
        limit_req          zone=dc_api burst=20 nodelay;
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # PostgREST API (internal only via Next.js — block direct access)
    location /rest/ {
        return 403;
    }
}
