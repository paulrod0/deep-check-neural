###############################################################################
# Deep-Check INTEL — Clasificado / Air-Gap Edition
#
# Stack (fully self-contained, no internet required):
#   • db            — PostgreSQL 16 with Intel schema
#   • rest          — PostgREST (Supabase-compatible REST layer)
#   • ml-inference  — FastAPI + ONNX inference server (local models)
#   • app           — Next.js application (offline mode)
#   • cert-generator — One-shot self-signed TLS certificate generator
#   • nginx         — Reverse proxy with TLS (port 443 / 80)
#
# Quick start:
#   cp .env.intel.example .env
#   # Edit .env — fill in DB_PASSWORD, PGRST_JWT_SECRET, LOCAL_JWT_SECRET
#   docker compose -f docker-compose.intel.yml up -d
#
# Generate license (requires MASTER_LICENSE_SECRET on an admin workstation):
#   node scripts/generate-license.js
###############################################################################

version: '3.9'

services:

  # ── Certificate Generator (one-shot) ────────────────────────────────────────
  cert-generator:
    image: alpine/openssl
    container_name: deepcheck-intel-certs
    restart: "no"
    volumes:
      - ./docker/certs:/certs
    entrypoint: >
      sh -c "
        if [ ! -f /certs/server.crt ]; then
          echo '[cert-generator] Generating self-signed TLS certificate...';
          openssl req -x509 -nodes -newkey rsa:4096
            -keyout /certs/server.key
            -out    /certs/server.crt
            -days   3650
            -subj   '/C=ES/ST=Madrid/L=Madrid/O=INTEL/OU=DeepCheck/CN=deepcheck.local'
            -addext 'subjectAltName=DNS:deepcheck.local,DNS:localhost,IP:127.0.0.1';
          chmod 600 /certs/server.key;
          echo '[cert-generator] Certificate generated successfully.';
        else
          echo '[cert-generator] Certificate already exists, skipping.';
        fi
      "
    healthcheck:
      test: ["CMD-SHELL", "test -f /certs/server.crt && echo ok"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - deepcheck-intel

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: deepcheck-intel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-deepcheck_intel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-deepcheck_intel}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/intel-init.sql:/docker-entrypoint-initdb.d/02-intel-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-deepcheck_intel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - deepcheck-intel

  # ── PostgREST ────────────────────────────────────────────────────────────────
  rest:
    image: postgrest/postgrest:v12.2.0
    container_name: deepcheck-intel-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${DB_USER:-deepcheck_intel}:${DB_PASSWORD}@db:5432/${DB_NAME:-deepcheck_intel}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: deepcheck_anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?Set PGRST_JWT_SECRET in .env}
      PGRST_DB_MAX_ROWS: 1000
      PGRST_SERVER_PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ | grep -q 'PostgREST' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - deepcheck-intel

  # ── ML Inference Server (ONNX / FastAPI) ─────────────────────────────────────
  ml-inference:
    image: python:3.11-slim
    container_name: deepcheck-intel-ml
    restart: unless-stopped
    working_dir: /app
    environment:
      LSTM_LAMBDA_SECRET: ${LSTM_LAMBDA_SECRET:-}
      MODELS_DIR: /app/models
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./models:/app/models:ro
      - ./docker/ml_server.py:/app/ml_server.py:ro
    command: >
      sh -c "
        pip install --no-cache-dir fastapi uvicorn onnxruntime numpy pillow python-multipart &&
        python ml_server.py
      "
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" 2>/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - deepcheck-intel

  # ── Next.js app (Air-Gap / Intel mode) ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: http://rest:3001
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${PGRST_JWT_ANON_KEY:?Set PGRST_JWT_ANON_KEY in .env}
        NEXT_PUBLIC_DEPLOY_MODE: intel
    container_name: deepcheck-intel-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ml-inference:
        condition: service_healthy
    environment:
      # Database (PostgREST — no Supabase cloud)
      NEXT_PUBLIC_SUPABASE_URL: http://rest:3001
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${PGRST_JWT_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${PGRST_JWT_SERVICE_KEY:?Set PGRST_JWT_SERVICE_KEY in .env}
      # ML inference — local, never leaves the enclave
      LSTM_LAMBDA_URL: ${LSTM_LAMBDA_URL:-http://ml-inference:8000}
      LSTM_LAMBDA_SECRET: ${LSTM_LAMBDA_SECRET:-}
      # Auth (local JWT, no magic links)
      LOCAL_JWT_SECRET: ${LOCAL_JWT_SECRET:?Set LOCAL_JWT_SECRET in .env}
      LOCAL_USERS: ${LOCAL_USERS:-}
      # Admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # Intel / air-gap flags
      DEPLOY_MODE: intel
      OFFLINE_MODE: "true"
      LICENSE_KEY: ${LICENSE_KEY}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./models:/app/models:ro
      - ./license:/app/license:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    networks:
      - deepcheck-intel

  # ── Nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: deepcheck-intel-nginx
    restart: unless-stopped
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -qO- http://localhost/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - deepcheck-intel
      - deepcheck-intel-external

volumes:
  db_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  deepcheck-intel:
    name: deepcheck-intel
    internal: true
  deepcheck-intel-external:
    name: deepcheck-intel-external
    # Not internal — nginx needs to accept external connections
